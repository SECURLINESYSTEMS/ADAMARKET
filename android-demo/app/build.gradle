plugins { id 'com.android.application' }

android {
    namespace 'uz.adamarket.app'
    compileSdk 35
    defaultConfig {
        applicationId 'uz.adamarket.app'
        minSdk 23
        targetSdk 35
        versionCode 11
        versionName '1.1.1'
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false; shrinkResources false }
    }
}
