<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ADAMARKET</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
 background:#f5f6f8;
 color:#17181c;
 padding-bottom:82px
}
button,input{font:inherit}
button{border:0;cursor:pointer}

.header{
 background:#fff;
 padding:18px 18px 14px;
 position:sticky;
 top:0;
 z-index:10;
 border-bottom:1px solid #eee
}
.logo{
 font-size:27px;
 font-weight:900;
 letter-spacing:-1px
}
.logo span{color:#2878ff}
.location{
 margin-top:4px;
 color:#777;
 font-size:13px
}

.search{
 margin:15px 16px 4px;
 background:#fff;
 border:1px solid #e5e6e9;
 border-radius:14px;
 display:flex;
 align-items:center;
 padding:0 14px
}
.search input{
 width:100%;
 border:0;
 outline:0;
 background:transparent;
 padding:13px 8px;
 font-size:15px
}

.section{
 padding:18px 16px 8px;
 font-size:19px;
 font-weight:800
}

.categories{
 display:flex;
 gap:9px;
 overflow-x:auto;
 padding:8px 16px 4px;
 scrollbar-width:none
}
.categories::-webkit-scrollbar{display:none}
.cat{
 flex:0 0 auto;
 background:#fff;
 border:1px solid #e8e8eb;
 padding:10px 13px;
 border-radius:12px;
 font-size:13px
}
.cat.active{
 background:#2878ff;
 color:white;
 border-color:#2878ff
}

.list{
 padding:8px 16px
}
.card{
 background:#fff;
 border-radius:17px;
 overflow:hidden;
 margin-bottom:14px;
 box-shadow:0 2px 10px rgba(0,0,0,.045)
}
.cover{
 width:100%;
 height:180px;
 object-fit:cover;
 background:#e9ebef
}
.noimage{
 height:130px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:linear-gradient(135deg,#e9eef8,#dfe5f1);
 font-size:42px
}
.cardbody{padding:14px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.badge{
 display:inline-block;
 padding:5px 8px;
 border-radius:7px;
 font-size:11px;
 font-weight:700;
 background:#eef1f5
}
.badge.vip{background:#fff0b8;color:#8b6500}
.badge.top{background:#e8f0ff;color:#2468d9}
.title{
 font-size:17px;
 font-weight:800;
 margin-bottom:7px
}
.meta{
 color:#74767c;
 font-size:13px;
 line-height:1.5
}
.price{
 margin-top:10px;
 font-size:18px;
 font-weight:900
}
.price small{
 font-size:12px;
 color:#777;
 font-weight:500
}

.empty{
 text-align:center;
 padding:45px 20px;
 color:#777
}
.empty-icon{font-size:45px;margin-bottom:10px}

.add{
 position:fixed;
 right:18px;
 bottom:86px;
 width:58px;
 height:58px;
 border-radius:50%;
 background:#2878ff;
 color:white;
 font-size:28px;
 box-shadow:0 7px 20px rgba(40,120,255,.35);
 z-index:20
}

.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:76px;
 background:#fff;
 border-top:1px solid #e5e5e5;
 display:flex;
 justify-content:space-around;
 z-index:30;
 padding-bottom:env(safe-area-inset-bottom)
}
.nav{
 flex:1;
 background:transparent;
 color:#888;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 gap:3px;
 font-size:10px
}
.nav .icon{font-size:21px}
.nav.active{color:#2878ff;font-weight:700}

.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.45);
 display:none;
 align-items:flex-end;
 z-index:100
}
.modal.show{display:flex}
.sheet{
 width:100%;
 background:#fff;
 border-radius:24px 24px 0 0;
 padding:22px 18px 30px;
 max-height:88vh;
 overflow:auto
}
.sheet h2{margin:0 0 18px}
.close{
 float:right;
 background:#f1f2f4;
 width:34px;height:34px;
 border-radius:50%
}
.field{
 width:100%;
 padding:13px;
 margin:7px 0;
 border:1px solid #ddd;
 border-radius:11px;
 outline:none
}
.primary{
 width:100%;
 background:#2878ff;
 color:#fff;
 padding:14px;
 border-radius:12px;
 font-weight:800;
 margin-top:10px
}
.info{
 background:#f5f7fb;
 padding:13px;
 border-radius:12px;
 margin:10px 0;
 font-size:13px;
 color:#555
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">ADA<span>MARKET</span></div>
  <div class="location">📍 Ташкент</div>
</div>

<div class="search">
  🔎
  <input id="search" placeholder="Что ищете?">
</div>

<div class="section">Категории</div>

<div class="categories">
  <button class="cat active" data-type="all">Все</button>
  <button class="cat" data-type="Билборд">🪧 Билборды</button>
  <button class="cat" data-type="LED-экран">📺 LED-экраны</button>
  <button class="cat" data-type="Транспорт">🚌 Транспорт</button>
  <button class="cat" data-type="Telegram">📱 Telegram</button>
</div>

<div class="section">Рекламные места</div>
<div id="list" class="list">
  <div class="empty">
    <div class="empty-icon">⏳</div>
    Загружаем объявления...
  </div>
</div>

<button class="add" onclick="openAdd()">+</button>

<div class="bottom">
  <button class="nav active" onclick="showHome(this)">
    <span class="icon">🏠</span>Главная
  </button>
  <button class="nav" onclick="focusSearch(this)">
    <span class="icon">🔎</span>Поиск
  </button>
  <button class="nav" onclick="showFavorites(this)">
    <span class="icon">❤️</span>Избранное
  </button>
  <button class="nav" onclick="showProfile(this)">
    <span class="icon">👤</span>Профиль
  </button>
</div>

<div id="modal" class="modal" onclick="closeOutside(event)">
  <div class="sheet">
    <button class="close" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
/* =========================
   ADAMARKET CONFIG
========================= */

const SUPABASE_URL =
  "https://nmskpqugwiwdcukqckcy.supabase.co";

/*
 * Здесь нужен PUBLIC / ANON ключ Supabase.
 * Не вставляй service_role key.
 */
const SUPABASE_KEY = "ВСТАВЬ_СЮДА_ANON_ИЛИ_PUBLISHABLE_KEY";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const tg = window.Telegram?.WebApp;

if(tg){
  tg.ready();
  tg.expand();

  if(tg.setHeaderColor)
    tg.setHeaderColor("#ffffff");

  if(tg.setBackgroundColor)
    tg.setBackgroundColor("#f5f6f8");
}

/* =========================
   STATE
========================= */

let allPlaces = [];
let currentType = "all";
let favorites = JSON.parse(
  localStorage.getItem("adamarket_favorites") || "[]"
);

/* =========================
   LOAD
========================= */

async function loadPlaces(){

  const list = document.getElementById("list");

  const {data,error} = await db
    .from("ad_places")
    .select(`
      id,
      title,
      type,
      city,
      district,
      address,
      price,
      currency,
      unit,
      description,
      cover_image,
      images,
      promotion_type,
      promotion_until,
      reach,
      traffic,
      status,
      is_active,
      created_at
    `)
    .eq("is_active",true)
    .eq("status","approved")
    .order("created_at",{ascending:false});

  if(error){
    console.error(error);

    list.innerHTML = `
      <div class="empty">
        <div class="empty-icon">⚠️</div>
        <b>Не удалось загрузить объявления</b>
        <p>Проверь подключение Supabase.</p>
      </div>
    `;

    return;
  }

  allPlaces = data || [];
  render();
}

/* =========================
   RENDER
========================= */

function render(){

  const query =
    document.getElementById("search").value
    .trim()
    .toLowerCase();

  let places = allPlaces.filter(p=>{

    const typeOk =
      currentType === "all" ||
      p.type === currentType;

    const text = `
      ${p.title || ""}
      ${p.description || ""}
      ${p.city || ""}
      ${p.district || ""}
      ${p.address || ""}
      ${p.type || ""}
    `.toLowerCase();

    const searchOk =
      !query || text.includes(query);

    return typeOk && searchOk;
  });

  /*
   * VIP / TOP сначала
   */
  places.sort((a,b)=>{
    const rank = {
      vip:4,
      turbo:3,
      top:2,
      raise:1,
      none:0
    };

    return (rank[b.promotion_type] || 0)
         - (rank[a.promotion_type] || 0);
  });

  const list = document.getElementById("list");

  if(!places.length){

    list.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🔍</div>
        <b>Ничего не найдено</b>
        <p>Попробуйте изменить поиск или категорию.</p>
      </div>
    `;

    return;
  }

  list.innerHTML = places.map(placeCard).join("");
}

/* =========================
   CARD
========================= */

function placeCard(p){

  const fav = favorites.includes(p.id);

  let image = p.cover_image;

  if(!image && Array.isArray(p.images) && p.images.length){
    image = p.images[0];
  }

  let badge = "";

  if(p.promotion_type === "vip")
    badge = `<span class="badge vip">⭐ VIP</span>`;

  if(p.promotion_type === "top")
    badge = `<span class="badge top">🔥 TOP</span>`;

  if(p.promotion_type === "turbo")
    badge = `<span class="badge top">🚀 TURBO</span>`;

  const location = [
    p.city,
    p.district,
    p.address
  ].filter(Boolean).join(" · ");

  return `
    <div class="card" onclick="openPlace(${p.id})">

      ${
        image
        ? `<img class="cover"
             src="${escapeHtml(image)}"
             onerror="this.style.display='none'">`
        : `<div class="noimage">📢</div>`
      }

      <div class="cardbody">

        <div class="badges">
          ${badge}
          <span class="badge">${escapeHtml(p.type || "Реклама")}</span>
        </div>

        <div class="title">
          ${escapeHtml(p.title || "Рекламное место")}
        </div>

        <div class="meta">
          ${escapeHtml(location || "Ташкент")}
        </div>

        ${
          p.reach
          ? `<div class="meta">👥 Охват: ${escapeHtml(p.reach)}</div>`
          : ""
        }

        ${
          p.traffic
          ? `<div class="meta">🚗 Трафик: ${escapeHtml(p.traffic)}</div>`
          : ""
        }

        <div class="price">
          ${formatPrice(p.price,p.currency)}
          <small>/ ${escapeHtml(p.unit || "месяц")}</small>
        </div>

      </div>
    </div>
  `;
}

/* =========================
   PLACE DETAILS
========================= */

async function openPlace(id){

  const p = allPlaces.find(x=>x.id === id);

  if(!p) return;

  const fav = favorites.includes(id);

  document.getElementById("modalContent").innerHTML = `

    <h2>${escapeHtml(p.title || "Рекламное место")}</h2>

    <div class="badges">
      <span class="badge">
        ${escapeHtml(p.type || "Реклама")}
      </span>
    </div>

    <div class="info">
      📍 ${escapeHtml(
        [p.city,p.district,p.address]
        .filter(Boolean).join(" · ") || "Ташкент"
      )}
    </div>

    <div class="info">
      💰 <b>${formatPrice(p.price,p.currency)}</b>
      / ${escapeHtml(p.unit || "месяц")}
    </div>

    ${
      p.description
      ? `<div class="info">
          ${escapeHtml(p.description)}
        </div>`
      : ""
    }

    ${
      p.reach
      ? `<div class="info">👥 Охват: ${escapeHtml(p.reach)}</div>`
      : ""
    }

    ${
      p.traffic
      ? `<div class="info">🚗 Трафик: ${escapeHtml(p.traffic)}</div>`
      : ""
    }

    <button class="primary"
      onclick="toggleFavorite(${p.id})">
      ${fav ? "❤️ Убрать из избранного"
             : "♡ Добавить в избранное"}
    </button>

    <button class="primary"
      style="margin-top:8px"
      onclick="requestPlace(${p.id})">
      📩 Запросить рекламное место
    </button>
  `;

  openModal();
}

/* =========================
   FAVORITES
========================= */

function toggleFavorite(id){

  if(favorites.includes(id)){
    favorites =
      favorites.filter(x=>x!==id);
  }else{
    favorites.push(id);
  }

  localStorage.setItem(
    "adamarket_favorites",
    JSON.stringify(favorites)
  );

  closeModal();

  if(document.querySelector(".nav.active")?.innerText.includes("Избранное")){
    showFavorites();
  }
}

/* =========================
   FAVORITES SCREEN
========================= */

function showFavorites(btn){

  setActive(btn);

  const saved =
    allPlaces.filter(p=>favorites.includes(p.id));

  document.querySelector(".section").innerText =
    "Избранное";

  document.querySelector(".categories").style.display =
    "none";

  document.querySelector(".search").style.display =
    "none";

  document.getElementById("list").innerHTML =
    saved.length
    ? saved.map(placeCard).join("")
    : `
      <div class="empty">
        <div class="empty-icon">❤️</div>
        <b>Избранных объявлений пока нет</b>
        <p>Добавляйте интересные рекламные места.</p>
      </div>
    `;
}

/* =========================
   HOME
========================= */

function showHome(btn){

  setActive(btn);

  document.querySelector(".section").innerText =
    "Рекламные места";

  document.querySelector(".categories").style.display =
    "flex";

  document.querySelector(".search").style.display =
    "flex";

  currentType = "all";

  document.querySelectorAll(".cat")
    .forEach(x=>x.classList.remove("active"));

  document.querySelector(".cat")
    ?.classList.add("active");

  render();
}

/* =========================
   SEARCH
========================= */

function focusSearch(btn){

  setActive(btn);

  document.querySelector(".search").style.display =
    "flex";

  document.querySelector(".search input").focus();
}

/* =========================
   PROFILE
========================= */

function showProfile(btn){

  setActive(btn);

  document.querySelector(".section").innerText =
    "Мой профиль";

  document.querySelector(".categories").style.display =
    "none";

  document.querySelector(".search").style.display =
    "none";

  const user =
    tg?.initDataUnsafe?.user;

  const name =
    user
    ? [user.first_name,user.last_name]
        .filter(Boolean).join(" ")
    : "Пользователь Telegram";

  document.getElementById("list").innerHTML = `

    <div class="card">
      <div class="cardbody">

        <div style="font-size:48px">👤</div>

        <div class="title">
          ${escapeHtml(name)}
        </div>

        ${
          user?.username
          ? `<div class="meta">
              @${escapeHtml(user.username)}
            </div>`
          : ""
        }

        <button class="primary"
          onclick="openMyAds()">
          📋 Мои объявления
        </button>

        <button class="primary"
          onclick="openWallet()">
          💰 Баланс
        </button>

        <button class="primary"
          onclick="openPlans()">
          ⭐ VIP / TOP
        </button>

      </div>
    </div>
  `;
}

/* =========================
   ADD AD
========================= */

function openAdd(){

  document.getElementById("modalContent").innerHTML = `

    <h2>📢 Разместить объявление</h2>

    <div class="info">
      Здесь будет полноценная форма добавления
      рекламного места в ADAMARKET.
    </div>

    <input class="field"
      placeholder="Название рекламного места">

    <select class="field">
      <option>Билборд</option>
      <option>LED-экран</option>
      <option>Транспорт</option>
      <option>Telegram</option>
    </select>

    <input class="field"
      placeholder="Город">

    <input class="field"
      placeholder="Район">

    <input class="field"
      type="number"
      placeholder="Цена в сумах">

    <textarea class="field"
      rows="4"
      placeholder="Описание"></textarea>

    <button class="primary"
      onclick="telegramAlert('Следующим этапом подключим сохранение объявления в Supabase.')">
      Опубликовать
    </button>
  `;

  openModal();
}

/* =========================
   REQUEST
========================= */

function requestPlace(id){

  const p =
    allPlaces.find(x=>x.id===id);

  telegramAlert(
    "Запрос на рекламное место:\n\n" +
    (p?.title || "Объявление") +
    "\n\nСледующим этапом подключим бронирование."
  );
}

/* =========================
   OTHER SCREENS
========================= */

function openMyAds(){

  telegramAlert(
    "Раздел «Мои объявления» подключим к профилю пользователя Telegram."
  );
}

function openWallet(){

  telegramAlert(
    "Баланс и пополнение подключим следующим этапом."
  );
}

function openPlans(){

  telegramAlert(
    "Здесь будут тарифы и продвижение: VIP, TOP, поднятие и TURBO."
  );
}

/* =========================
   MODAL
========================= */

function openModal(){
  document.getElementById("modal")
    .classList.add("show");
}

function closeModal(){
  document.getElementById("modal")
    .classList.remove("show");
}

function closeOutside(e){
  if(e.target.id==="modal")
    closeModal();
}

/* =========================
   CATEGORY
========================= */

document.querySelectorAll(".cat")
.forEach(btn=>{

  btn.addEventListener("click",()=>{

    document.querySelectorAll(".cat")
      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    currentType =
      btn.dataset.type;

    render();
  });
});

/* =========================
   SEARCH INPUT
========================= */

document.getElementById("search")
.addEventListener("input",render);

/* =========================
   HELPERS
========================= */

function setActive(btn){

  document.querySelectorAll(".nav")
    .forEach(x=>x.classList.remove("active"));

  if(btn)
    btn.classList.add("active");
}

function formatPrice(price,currency){

  if(price === null ||
     price === undefined ||
     price === 0)
    return "Цена по запросу";

  const value =
    Number(price).toLocaleString("ru-RU");

  return value +
    " " +
    (currency === "UZS"
      ? "сум"
      : (currency || ""));
}

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function telegramAlert(text){

  if(tg?.showAlert)
    tg.showAlert(text);
  else
    alert(text);
}

/* =========================
   START
========================= */

loadPlaces();
</script>

</body>
</html>
