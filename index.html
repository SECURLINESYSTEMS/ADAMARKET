function goHome(){renderHome();scrollTo(0,0)}function action(id){if(id==="search")return renderSearch();if(!S.session)return needAuth();if(id==="add"){const role=S.profile?.account_type||S.profile?.role;if(role==="manufacturer")return renderProducer();if(role==="business"||role==="admin")return renderAdd();return renderSearch()}if(id==="favorites")return renderFav();if(id==="profile")return renderProfile();if(id==="messages")return renderMessages()}
function needAuth(){document.getElementById("auth").classList.remove("hidden");authMode(false)}function closeAuth(){document.getElementById("auth").classList.add("hidden")}
function authMode(s){S.signup=s;document.getElementById("authTitle").textContent=s?"Регистрация":"Вход";document.getElementById("tabLogin").classList.toggle("on",!s);document.getElementById("tabSignup").classList.toggle("on",s);document.getElementById("signupFields").classList.toggle("hidden",!s);document.getElementById("authSub").textContent=s?"Создайте аккаунт. ИНН фирмы обязателен. Тип аккаунта здесь не выбирается.":"Войдите, чтобы продолжить.";document.getElementById("authBtn").textContent=s?"Создать аккаунт":"Войти";document.getElementById("aName").required=s;document.getElementById("aPhone").required=s;document.getElementById("aInn").required=s}
document.getElementById("authForm").onsubmit=async e=>{e.preventDefault();const nameEl=document.getElementById("aName"),phoneEl=document.getElementById("aPhone"),innEl=document.getElementById("aInn"),emailEl=document.getElementById("aEmail"),passEl=document.getElementById("aPass");try{if(S.signup){const inn=innEl.value.replace(/\s/g,"");if(!/^[0-9]{9,14}$/.test(inn))throw Error("ИНН фирмы: 9–14 цифр");const {data,error}=await sb.auth.signUp({email:emailEl.value.trim(),password:passEl.value,options:{data:{full_name:nameEl.value.trim(),phone:phoneEl.value.trim(),inn}}});if(error)throw error;if(!data.session){toast("Проверьте email для подтверждения");return}}else{const {error}=await sb.auth.signInWithPassword({email:emailEl.value.trim(),password:passEl.value});if(error)throw error}closeAuth();const current=await sb.auth.getSession();S.session=current.data.session||null;if(S.session)await bootstrap();renderHome()}catch(e){toast(e.message)}};
function renderHome(){document.getElementById("content").innerHTML=`<section class="hero"><div class="heroIn"><h1>Реклама работает на ваш <b>бизнес!</b></h1><p>Находите рекламные места, производителей и клиентов в одном месте.</p><button class="primary" onclick="action('search')">⌕ &nbsp;Найти место</button></div></section><section class="quick">${[['⌖','Рекламные места','Найти и разместить рекламу'],['▥','Производители','Баннеры, вывески, объёмные буквы'],['◉','Рекламодатели','Ищите места для своей рекламы'],['▦','Бизнес','Размещайте свою рекламу']].map(x=>`<button class="quickCard" onclick="action('search')"><div class="qicon">${x[0]}</div><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')}</section><section class="section"><div class="head"><h2>Популярные категории</h2><button class="link" onclick="action('search')">Все категории →</button></div><div class="cats">${cats.map(x=>`<button class="cat" onclick="action('search')"><div class="ci">${x[0]}</div><b>${x[1]}</b></button>`).join('')}</div></section><section class="section"><div class="head"><h2>Топ объявления</h2><button class="link" onclick="action('search')">Все →</button></div><div class="list">${S.demo.slice(0,2).map(adCard).join('')}</div></section>`}
function adCard(p){return `<article class="ad" onclick="action('search')"><img src="${esc(p.cover_image)}"><button class="heart" onclick="event.stopPropagation();action('favorites')">♡</button><div class="adbody"><span class="badge">${esc(p.type)}</span><h3>${esc(p.title)}</h3><div class="meta">⌖ Ташкент, ${esc(p.district)}</div><div class="price">от ${money(p.price)}</div></div></article>`}
function renderSearch(){let a=S.places.length ? S.places : S.demo;document.getElementById("content").innerHTML=`<div class="page"><div class="head"><h1 class="pageTitle">Поиск рекламных мест</h1><button class="ghost" onclick="goHome()">Главная</button></div><div class="panel"><input id="searchQ" class="field" placeholder="Название, район, адрес..." oninput="filterSearch()"></div><div id="results" class="list">${a.map(adCard).join('')}</div></div>`}
function filterSearch(){let q=(document.getElementById("searchQ")?.value||"").toLowerCase();let a=(S.places.length ? S.places : S.demo).filter(p=>(p.title+" "+p.type+" "+p.city+" "+p.district+" "+(p.address||"")).toLowerCase().includes(q));document.getElementById("results").innerHTML=a.length?a.map(adCard).join(""): '<div class="panel empty">Ничего не найдено.</div>'}
function renderFav(){let a=[...S.places,...S.demo].filter(p=>S.favorites.has(p.id));document.getElementById("content").innerHTML=`<div class="page"><h1 class="pageTitle">Избранное</h1>${a.length?'<div class="list">'+a.map(adCard).join('')+'</div>':'<div class="panel empty">Здесь появятся сохранённые рекламные места.</div>'}</div>`}
function renderMessages(){document.getElementById("content").innerHTML='<div class="page"><h1 class="pageTitle">Сообщения</h1><div class="panel empty">Сообщения и заявки будут отображаться здесь.</div></div>'}
function renderProfile(){document.getElementById("content").innerHTML=`<div class="page"><h1 class="pageTitle">Профиль</h1><div class="panel"><h2 style="margin-top:0">${esc(S.profile?.full_name||"Пользователь")}</h2><div class="meta">${esc(S.profile?.phone||"Телефон не указан")}</div><div class="meta" style="margin-top:8px">ИНН фирмы: ${esc(S.profile?.inn||"указан при регистрации")}</div></div><div class="panel"><div class="actions"><button class="primary" onclick="renderPlans()">Продвижение</button><button class="ghost" onclick="renderMyAds()">Мои объявления</button><button class="ghost" onclick="logout()">Выйти</button></div></div></div>`}
function renderMyAds(){document.getElementById("content").innerHTML=`<div class="page"><div class="head"><h1 class="pageTitle">Мои объявления</h1><button class="primary" onclick="renderAdd()">＋ Добавить</button></div>${S.myAds.length?S.myAds.map(p=>`<div class="panel"><b>${esc(p.title)}</b><div class="meta" style="margin-top:5px">${esc(p.type)} · ${money(p.price)} / ${unit(p.unit)}</div><div class="actions" style="margin-top:12px"><button class="ghost" onclick="editPlace(${p.id})">Редактировать</button></div></div>`).join(""):'<div class="panel empty">У вас пока нет объявлений.</div>'}</div>`}
function renderPlans(){document.getElementById("content").innerHTML=`<div class="page"><h1 class="pageTitle">Продвижение</h1><p class="note">Новые тарифы ADAMARKET — без копирования старого интерфейса. Выберите формат, отправьте заявку, а администратор подтвердит оплату.</p><div class="list" id="plans"></div></div>`;loadPlans()}
async function loadPlans(){try{let r=await fetch(API+"?action=plans"),d=await r.json();S.plans=d.plans||[]}catch(e){S.plans=[]}if(!S.plans.length)S.plans=[{id:1,name:"Старт",price_monthly:67200,features:{description:"ТОП-размещение на 3 дня"}},{id:2,name:"Быстрая продажа",price_monthly:143300,features:{description:"ТОП-размещение на 7 дней + поднятия"}},{id:3,name:"Турбо продажа",price_monthly:417500,features:{description:"ТОП 30 дней + поднятия + VIP"}}];document.getElementById("plans").innerHTML=S.plans.map(p=>`<div class="panel"><span class="badge">ADAMARKET</span><h2>${esc(p.name)}</h2><div class="price">${Number(p.price_monthly)?money(p.price_monthly):"Бесплатно"}</div><p class="note">${esc(p.features?.description||"Продвижение объявления")}</p><button class="primary" style="width:100%;margin-top:8px" onclick="requestPlan(${p.id})">Отправить заявку</button></div>`).join("")}
async function requestPlan(id){try{await api("create_payment_request",{planId:id});toast("Заявка на оплату отправлена")}catch(e){toast(e.message)}}
function renderProducer(){if(!S.session)return needAuth();document.getElementById("content").innerHTML=`<div class="page"><div class="head"><h1 class="pageTitle">Разместить производство</h1><button class="ghost" onclick="goHome()">Отмена</button></div><div class="panel"><div class="formgrid"><div class="full"><label class="label">Название компании *</label><input id="pCompany" class="field"></div><div><label class="label">Город *</label><input id="pCity" class="field" value="Ташкент"></div><div><label class="label">Район</label><input id="pDistrict" class="field"></div><div class="full"><label class="label">Что изготавливаете *</label><div id="pCats" class="actions">${["Баннеры","Объёмные буквы","Вывески","Световые короба","LED-экраны","Билборды","Плёнка / наклейки"].map(x=>`<button type="button" class="ghost" data-cat="${esc(x)}">${esc(x)}</button>`).join("")}</div></div><div class="full"><label class="label">Описание</label><textarea id="pDesc" class="field" rows="5"></textarea></div><div class="full"><button class="primary" onclick="createProducer()">Отправить на модерацию</button></div></div></div></div>`;document.getElementById("pCats").querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{b.classList.toggle("primary");b.classList.toggle("ghost")})}
async function createProducer(){try{const categories=[...document.getElementById("pCats").querySelectorAll(".primary")].map(x=>x.dataset.cat);if(!categories.length)throw Error("Выберите хотя бы одну категорию производства");await api("create_producer",{producer:{company_name:document.getElementById("pCompany").value.trim(),city:document.getElementById("pCity").value.trim(),district:document.getElementById("pDistrict").value.trim(),description:document.getElementById("pDesc").value.trim(),categories}});toast("Услуга отправлена на проверку");await bootstrap();renderProfile()}
catch(e){toast(e.message)}}
function renderAdd(){document.getElementById("content").innerHTML=`<div class="page"><div class="head"><h1 class="pageTitle">Добавить рекламное место</h1><button class="ghost" onclick="goHome()">Отмена</button></div><div class="panel"><div class="formgrid"><div class="full"><label class="label">Название *</label><input id="fTitle" class="field"></div><div><label class="label">Тип *</label><select id="fType" class="field"><option>Баннер</option><option>Билборд</option><option>LED-экран</option><option>Вывеска</option><option>Световой короб</option></select></div><div><label class="label">Цена *</label><input id="fPrice" class="field" type="number"></div><div><label class="label">Город</label><input id="fCity" class="field" value="Ташкент"></div><div><label class="label">Район</label><input id="fDistrict" class="field"></div><div class="full"><label class="label">Адрес</label><input id="fAddress" class="field"></div><div><label class="label">Площадь, м²</label><input id="fArea" class="field" type="number" min="0" step="0.01"></div><div class="full"><label class="label">Разрешённые форматы рекламы</label><div id="fAllowed" class="actions"><button type="button" class="ghost" data-type="Баннер">Баннер</button><button type="button" class="ghost" data-type="LED-экран">LED-экран</button><button type="button" class="ghost" data-type="Билборд">Билборд</button><button type="button" class="ghost" data-type="Вывеска">Вывеска</button><button type="button" class="ghost" data-type="Объёмные буквы">Объёмные буквы</button></div></div><div><label class="label">Широта</label><input id="fLat" class="field" type="number" step="any"></div><div><label class="label">Долгота</label><input id="fLng" class="field" type="number" step="any"></div><div class="full"><button class="ghost" type="button" onclick="pickMap()">🗺️ Указать координаты на карте</button><div id="pick" class="hidden" style="margin-top:10px"><div id="pickMap" style="height:280px;border-radius:15px;overflow:hidden"></div></div></div><div class="full"><label class="label">Фото</label><div class="upload"><input id="fPhotos" type="file" accept="image/*" multiple></div></div><div class="full"><label class="label">Описание</label><textarea id="fDesc" class="field" rows="5"></textarea></div><div class="full"><button class="primary" style="width:100%" onclick="createPlace()">Отправить на модерацию</button></div></div></div></div>`}
let pickMapObj=null,pickMarker=null;function pickMap(){document.getElementById("pick").classList.remove("hidden");setTimeout(()=>{if(!pickMapObj){pickMapObj=L.map("pickMap").setView([41.3111,69.2797],11);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(pickMapObj);pickMapObj.on("click",e=>{document.getElementById("fLat").value=e.latlng.lat.toFixed(6);document.getElementById("fLng").value=e.latlng.lng.toFixed(6);if(pickMarker)pickMarker.setLatLng(e.latlng);else pickMarker=L.marker(e.latlng).addTo(pickMapObj)})}pickMapObj.invalidateSize()},80)}
async function createPlace(){try{let place={title:document.getElementById("fTitle").value,type:document.getElementById("fType").value,price:document.getElementById("fPrice").value,unit:"month",city:document.getElementById("fCity").value,district:document.getElementById("fDistrict").value,address:document.getElementById("fAddress").value,latitude:document.getElementById("fLat").value?Number(document.getElementById("fLat").value):null,longitude:document.getElementById("fLng").value?Number(document.getElementById("fLng").value):null,description:document.getElementById("fDesc").value,area_m2:document.getElementById("fArea")?.value?Number(document.getElementById("fArea").value):null,allowed_ad_types:[...(document.getElementById("fAllowed")?.querySelectorAll(".primary")||[])].map(x=>x.dataset.type)};await api("create_place",{place});toast("Объявление отправлено на модерацию");await bootstrap();renderMyAds()}catch(e){toast(e.message)}}
async function editPlace(id){let p=S.myAds.find(x=>x.id===id);if(!p)return;renderAdd();setTimeout(()=>{document.getElementById("fTitle").value=p.title||"";document.getElementById("fType").value=p.type||"Баннер";document.getElementById("fPrice").value=p.price||"";document.getElementById("fCity").value=p.city||"Ташкент";document.getElementById("fDistrict").value=p.district||"";document.getElementById("fAddress").value=p.address||"";document.getElementById("fLat").value=p.latitude||"";document.getElementById("fLng").value=p.longitude||"";document.getElementById("fDesc").value=p.description||""},0)}
async function updatePlace(id){try{const p=S.myAds.find(x=>x.id===id);if(!p)throw Error("Объявление не найдено");const images=Array.isArray(p.images)?p.images:[];const allowed=[...(document.getElementById("fAllowed")?.querySelectorAll(".primary")||[])].map(x=>x.dataset.type);const place={title:document.getElementById("fTitle").value,type:document.getElementById("fType").value,price:document.getElementById("fPrice").value,unit:p.unit||"month",city:document.getElementById("fCity").value,district:document.getElementById("fDistrict").value,address:document.getElementById("fAddress").value,latitude:document.getElementById("fLat").value?Number(document.getElementById("fLat").value):null,longitude:document.getElementById("fLng").value?Number(document.getElementById("fLng").value):null,description:document.getElementById("fDesc").value,reach:p.reach??null,traffic:p.traffic??null,images,cover_image:p.cover_image??images[0]??null,area_m2:document.getElementById("fArea")?.value?Number(document.getElementById("fArea").value):(p.area_m2??null),allowed_ad_types:allowed.length?allowed:(p.allowed_ad_types||[])};await api("update_place",{placeId:id,place});toast("Изменения сохранены");await bootstrap();renderMyAds()}catch(e){toast(e.message)}}
async function toggleFav(id){if(id<0)return toast("Демо-объявление");try{let d=await api("toggle_favorite",{placeId:id});d.favorite?S.favorites.add(id):S.favorites.delete(id);toast(d.favorite?"Добавлено в избранное":"Удалено из избранного")}catch(e){toast(e.message)}}
async function bootstrap(){let d=await api("bootstrap");S.profile=d.profile;S.myAds=d.ads||[];S.favorites=new Set(d.favorites||[]);S.session=true}
async function loadPlaces(){try{let r=await fetch(API+"?action=places"),d=await r.json();S.places=d.places||[]}catch(e){S.places=[]}}
async function logout(){await sb.auth.signOut();S.session=null;S.profile=null;renderHome();toast("Вы вышли из аккаунта")}
function toggleLang(){const m=document.getElementById("langmenu");m.style.display=m.style.display==="block"?"none":"block"}function setLang(l,f){S.lang=l;localStorage.setItem('adamarket_lang',l);localStorage.setItem('adamarket_flag',f);document.getElementById("flag").textContent=f;document.getElementById("langmenu").style.display="none";toast(l==="ru"?"Русский":l==="uz"?"O‘zbek":"English")}









(async()=>{const {data}=await sb.auth.getSession();if(data.session){S.session=data.session;try{await bootstrap()}catch(e){S.session=null;S.profile=null}}await loadPlaces();renderHome()})();
</script></body></html>
