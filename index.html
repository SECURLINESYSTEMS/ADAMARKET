const cats=[["assets/icon-banners.png","banners"],["assets/icon-signage.png","signage"],["assets/icon-business.png","letters"],["assets/icon-advertisers.png","lightbox"],["assets/icon-led.png","led"],["assets/icon-billboard.png","billboard"],["assets/icon-ad-places.png","film"],["assets/icon-producers.png","other"]];
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function money(v){return Number(v||0).toLocaleString("ru-RU")+" сум"}function unit(v){return v==="day"?"день":v==="week"?"неделя":"месяц"}function toast(t){let x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),2400)}
async function api(action,data={}){let {data:s}=await sb.auth.getSession();if(!s.session)throw Error("Сначала войдите в аккаунт");let r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+s.session.access_token},body:JSON.stringify({action,...data})});let d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||"Ошибка сервера");return d}
function goHome(){renderHome();scrollTo(0,0)}function action(id){if(id==="add")renderAdd();else if(id==="search"){loadPlaces().finally(renderSearch)}else if(id==="favorites")renderFav();else if(id==="profile")state.session?renderProfile():needAuth();else if(id==="messages")renderMessages()}
function needAuth(){document.getElementById("auth").classList.remove("hidden");authMode(false)}function closeAuth(){document.getElementById("auth").classList.add("hidden")}
function authMode(s){state.signup=s;document.getElementById("authTitle").textContent=s?"Регистрация":"Вход";document.getElementById("tabLogin").classList.toggle("on",!s);document.getElementById("tabSignup").classList.toggle("on",s);document.getElementById("signupFields").classList.toggle("hidden",!s);document.getElementById("authSub").textContent=s?"Создайте аккаунт. ИНН фирмы обязателен. Тип аккаунта здесь не выбирается.":"Войдите, чтобы продолжить.";document.getElementById("authBtn").textContent=s?"Создать аккаунт":"Войти";document.getElementById("aName").required=s;document.getElementById("aPhone").required=s;document.getElementById("aInn").required=s}
document.getElementById("authForm").onsubmit=async e=>{e.preventDefault();if(document.querySelector(".trap")?.value)return;if(!document.getElementById("termsAgree").checked||!document.getElementById("humanCheck").checked){toast("Подтвердите оферту и что вы не робот");return}const email=document.getElementById("aEmail").value.trim(),password=document.getElementById("aPass").value,name=document.getElementById("aName").value.trim(),phone=document.getElementById("aPhone").value.trim(),inn=document.getElementById("aInn").value.replace(/\s/g,"");try{if(state.signup){if(!/^[0-9]{9,14}$/.test(inn))throw Error("ИНН фирмы: 9–14 цифр");let {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name,phone,inn}}});if(error)throw error;if(!data.session){toast("Проверьте email для подтверждения");return}}else{let {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error}closeAuth();location.reload()}catch(e){toast(e.message||"Не удалось выполнить вход")}};
function renderHome(){document.getElementById("content").innerHTML=`<section class="hero"><div class="heroIn"><h1>${t("heroTitle")} <b>${t("heroAccent")}</b></h1><p>${t("heroText")}</p><button class="primary" onclick="action('search')">⌕ &nbsp;${t("find")}</button></div></section><section class="aiPanel"><div class="aiBadge">AI ADAMARKET</div><h2>Найдём рекламу под вашу задачу</h2><p>Напишите район, формат и бюджет — помощник подберёт варианты из каталога.</p><div class="aiRow"><input id="aiQuestion" class="field" placeholder="Например: LED-экран возле Чиланзара до 2 млн"><button class="primary" onclick="askAI()">Спросить</button></div><div id="aiAnswer" class="aiAnswer hidden"></div></section><section class="quick">${[['assets/icon-ad-places.png',t('places'),'Найти и разместить рекламу'],['assets/icon-producers.png',t('producers'),'Баннеры, вывески, объёмные буквы'],['assets/icon-advertisers.png',t('advertisers'),'Ищите места для своей рекламы'],['assets/icon-business.png',t('business'),'Размещайте свою рекламу']].map(x=>`<button class="quickCard" onclick="action('search')"><img class="qimg" src="${x[0]}" alt=""><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')}</section><section class="section"><div class="head"><h2>${t("popular")}</h2><button class="link" onclick="action('search')">${t("all")} →</button></div><div class="cats">${cats.map(x=>`<button class="cat" onclick="action('search')"><img class="cimg" src="${x[0]}" alt=""><b>${t(x[1])}</b></button>`).join('')}</div></section><section class="section"><div class="head"><h2>${t("top")}</h2><button class="link" onclick="action('search')">${t("allShort")} →</button></div><div class="list">${(state.places.length?state.places:state.demo).slice(0,2).map(adCard).join('')}</div></section>`}
function adCard(p){return `<article class="ad" onclick="action('search')"><img src="${esc(p.cover_image)}"><button class="heart" aria-label="Добавить в избранное" onclick="event.stopPropagation();toggleFav(${p.id})">${state.favorites.has(p.id)?"♥":"♡"}</button><div class="adbody"><span class="badge">${esc(p.type)}</span><h3>${esc(p.title)}</h3><div class="meta">⌖ Ташкент, ${esc(p.district)}</div><div class="price">от ${money(p.price)}</div></div></article>`}
function renderSearch(){let a=state.places.length?state.places:state.demo;document.getElementById("content").innerHTML=`<div class="page"><div class="head"><h1 class="pageTitle">${t("searchTitle")}</h1><button class="ghost" onclick="goHome()">${t("home")}</button></div><div class="panel"><input id="searchQ" class="field" placeholder="${t("searchPlaceholder")}" oninput="filterSearch()"></div><div id="results" class="list">${a.map(adCard).join('')}</div></div>`}
function filterSearch(){let q=(document.getElementById("searchQ").value||"").toLowerCase();let a=(state.places.length?state.places:state.demo).filter(p=>(p.title+" "+p.type+" "+p.city+" "+p.district+" "+(p.address||"")).toLowerCase().includes(q));document.getElementById("results").innerHTML=a.length?a.map(adCard).join(""): '<div class="panel empty">'+t('nothing')+'</div>'}
function renderFav(){let a=[...state.places,...state.demo].filter(p=>state.favorites.has(p.id));document.getElementById("content").innerHTML=`<div class="page"><h1 class="pageTitle">Избранное</h1>${a.length?'<div class="list">'+a.map(adCard).join('')+'</div>':'<div class="panel empty">Здесь появятся сохранённые рекламные места.</div>'}</div>`}
function renderMessages(){document.getElementById("content").innerHTML='<div class="page"><h1 class="pageTitle">Сообщения</h1><div class="panel empty">Сообщения и заявки будут отображаться здесь.</div></div>'}
function renderProfile(){document.getElementById("content").innerHTML=`<div class="page"><h1 class="pageTitle">Профиль</h1><div class="panel"><h2 style="margin-top:0">${esc(state.profile?.full_name||"Пользователь")}</h2><div class="meta">${esc(state.profile?.phone||"Телефон не указан")}</div><div class="meta" style="margin-top:8px">ИНН фирмы: ${esc(state.profile?.inn||"указан при регистрации")}</div></div><div class="panel"><div class="actions"><button class="ghost" disabled>Продвижение — скоро</button><button class="ghost" onclick="renderMyAds()">Мои объявления</button><button class="ghost" onclick="logout()">Выйти</button></div></div></div>`}
function renderMyAds(){document.getElementById("content").innerHTML=`<div class="page"><div class="head"><h1 class="pageTitle">Мои объявления</h1><button class="primary" onclick="renderAdd()">＋ Добавить</button></div>${state.myAds.length?state.myAds.map(p=>`<div class="panel"><b>${esc(p.title)}</b><div class="meta" style="margin-top:5px">${esc(p.type)} · ${money(p.price)} / ${unit(p.unit)}</div><div class="actions" style="margin-top:12px"><button class="ghost" onclick="editPlace(${p.id})">Редактировать</button></div></div>`).join(""):'<div class="panel empty">У вас пока нет объявлений.</div>'}</div>`}
function renderPlans(){document.getElementById("content").innerHTML=`<div class="page"><h1 class="pageTitle">Продвижение</h1><p class="note">Новые тарифы ADAMARKET — без копирования старого интерфейса. Выберите формат, отправьте заявку, а администратор подтвердит оплату.</p><div class="list" id="plans"></div></div>`;loadPlans()}
async function loadPlans(){try{let r=await fetch(API+"?action=plans"),d=await r.json();state.plans=d.plans||[]}catch(e){state.plans=[]}if(!state.plans.length)state.plans=[{id:1,name:"Старт",price_monthly:67200,features:{description:"ТОП-размещение на 3 дня"}},{id:2,name:"Быстрая продажа",price_monthly:143300,features:{description:"ТОП-размещение на 7 дней + поднятия"}},{id:3,name:"Турбо продажа",price_monthly:417500,features:{description:"ТОП 30 дней + поднятия + VIP"}}];document.getElementById("plans").innerHTML=state.plans.map(p=>`<div class="panel"><span class="badge">ADAMARKET</span><h2>${esc(p.name)}</h2><div class="price">${Number(p.price_monthly)?money(p.price_monthly):"Бесплатно"}</div><p class="note">${esc(p.features?.description||"Продвижение объявления")}</p><button class="primary" style="width:100%;margin-top:8px" onclick="requestPlan(${p.id})">Отправить заявку</button></div>`).join("")}
async function requestPlan(id){try{await api("create_payment_request",{planId:id});toast("Заявка на оплату отправлена")}catch(e){toast(e.message)}}
function renderAdd(){document.getElementById("content").innerHTML=`<div class="page"><div class="head"><h1 class="pageTitle">${t("freeAdd")}</h1><button class="ghost" onclick="goHome()">${t("cancel")}</button></div><div class="panel"><div class="formgrid"><div class="full"><label class="label">Название *</label><input id="fTitle" class="field"></div><div><label class="label">Тип *</label><select id="fType" class="field"><option>Баннер</option><option>Билборд</option><option>LED-экран</option><option>Вывеска</option><option>Световой короб</option></select></div><div><label class="label">Цена *</label><input id="fPrice" class="field" type="number"></div><div><label class="label">Город</label><input id="fCity" class="field" value="Ташкент"></div><div><label class="label">Район</label><input id="fDistrict" class="field"></div><div class="full"><label class="label">Адрес</label><input id="fAddress" class="field"></div><div><label class="label">Широта</label><input id="fLat" class="field" type="number" step="any"></div><div><label class="label">Долгота</label><input id="fLng" class="field" type="number" step="any"></div><div class="full"><button class="ghost" type="button" onclick="pickMap()">🗺️ Указать координаты на карте</button><div id="pick" class="hidden" style="margin-top:10px"><div id="pickMap" style="height:280px;border-radius:15px;overflow:hidden"></div></div></div><div class="full"><label class="label">Фото</label><div class="upload"><input id="fPhotos" type="file" accept="image/*" multiple></div></div><div class="full"><label class="label">Описание</label><textarea id="fDesc" class="field" rows="5"></textarea></div><div class="full"><label class="consent"><input id="freeTerms" type="checkbox" required> Я принимаю <a href="offer.html" target="_blank">оферту</a> и <a href="privacy.html" target="_blank">политику конфиденциальности</a>.</label><label class="consent"><input id="freeHuman" type="checkbox" required> Я не робот</label><input class="trap" id="freeTrap" tabindex="-1" autocomplete="off" aria-hidden="true"><button class="primary" style="width:100%" onclick="createPlace()">${t("freePublish")}</button></div></div></div></div>`}
let pickMapObj=null,pickMarker=null;function pickMap(){document.getElementById("pick").classList.remove("hidden");setTimeout(()=>{if(!pickMapObj){pickMapObj=L.map("pickMap").setView([41.3111,69.2797],11);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(pickMapObj);pickMapObj.on("click",e=>{document.getElementById("fLat").value=e.latlng.lat.toFixed(6);document.getElementById("fLng").value=e.latlng.lng.toFixed(6);if(pickMarker)pickMarker.setLatLng(e.latlng);else pickMarker=L.marker(e.latlng).addTo(pickMapObj)})}pickMapObj.invalidateSize()},80)}
async function createPlace(){try{if(!document.getElementById("freeTerms")?.checked||!document.getElementById("freeHuman")?.checked||document.getElementById("freeTrap")?.value)throw Error("Подтвердите оферту и что вы не робот");let title=document.getElementById("fTitle").value.trim(),price=Number(document.getElementById("fPrice").value);if(!title)throw Error("Укажите название");if(!Number.isFinite(price)||price<0)throw Error("Укажите корректную цену");let place={title,type:document.getElementById("fType").value,price,unit:"month",city:document.getElementById("fCity").value.trim()||"Ташкент",district:document.getElementById("fDistrict").value.trim(),address:document.getElementById("fAddress").value.trim(),latitude:document.getElementById("fLat").value?Number(document.getElementById("fLat").value):null,longitude:document.getElementById("fLng").value?Number(document.getElementById("fLng").value):null,description:document.getElementById("fDesc").value.trim(),owner_name:state.profile?.full_name||"Гость",owner_contact:state.profile?.phone||"guest-"+Date.now(),cover_image:"assets/tashkent-hero.jpg"};let r=await fetch("/api/places",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(place)}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"Не удалось разместить объявление");toast("Объявление добавлено в общий каталог");await loadPlaces();renderSearch()}catch(e){toast(e.message)}}
async function editPlace(id){let p=state.myAds.find(x=>x.id===id);if(!p)return;renderAdd();setTimeout(()=>{document.getElementById("fTitle").value=p.title||"";document.getElementById("fType").value=p.type||"Баннер";document.getElementById("fPrice").value=p.price||"";document.getElementById("fCity").value=p.city||"Ташкент";document.getElementById("fDistrict").value=p.district||"";document.getElementById("fAddress").value=p.address||"";document.getElementById("fLat").value=p.latitude??"";document.getElementById("fLng").value=p.longitude??"";document.getElementById("fDesc").value=p.description||"";const button=document.querySelector('#content button[onclick="createPlace()"]');if(button){button.textContent="Сохранить изменения";button.onclick=()=>updatePlace(id)}},0)}
async function updatePlace(id){try{const p=state.myAds.find(x=>x.id===id);if(!p)throw Error("Объявление не найдено");const title=document.getElementById("fTitle").value.trim(),price=Number(document.getElementById("fPrice").value);if(!title)throw Error("Укажите название");if(!Number.isFinite(price)||price<0)throw Error("Укажите корректную цену");const place={title,type:document.getElementById("fType").value,price,unit:p.unit||"month",city:document.getElementById("fCity").value.trim(),district:document.getElementById("fDistrict").value.trim(),address:document.getElementById("fAddress").value.trim(),latitude:document.getElementById("fLat").value?Number(document.getElementById("fLat").value):null,longitude:document.getElementById("fLng").value?Number(document.getElementById("fLng").value):null,description:document.getElementById("fDesc").value.trim()};await api("update_place",{placeId:id,place});toast("Изменения сохранены");await bootstrap();renderMyAds()}catch(e){toast(e.message||"Не удалось сохранить изменения")}}
async function toggleFav(id){state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);localStorage.setItem("adamarket_favorites",JSON.stringify([...state.favorites]));toast(state.favorites.has(id)?"Добавлено в избранное":"Удалено из избранного");renderSearch()}
async function bootstrap(){let d=await api("bootstrap");state.profile=d.profile;state.myAds=d.ads||[];state.favorites=new Set(d.favorites||[]);state.session=true}
async function loadPlaces(){let local=JSON.parse(localStorage.getItem(LOCAL_KEY)||"[]");try{let r=await fetch("/api/places",{headers:{Accept:"application/json"}}),d=await r.json();state.places=Array.isArray(d.places)?d.places:local;}catch(e){state.places=local}state.favorites=new Set(JSON.parse(localStorage.getItem("adamarket_favorites")||"[]"));return state.places}
async function askAI(){let q=document.getElementById("aiQuestion")?.value.trim(),box=document.getElementById("aiAnswer");if(!q)return toast("Напишите вопрос для AI");box.classList.remove("hidden");box.textContent="AI ищет подходящие варианты…";try{let r=await fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:q})}),d=await r.json();if(!r.ok)throw Error(d.error||"AI недоступен");box.textContent=d.answer||"Подходящих вариантов пока нет."}catch(e){box.textContent="AI временно недоступен. Откройте поиск — каталог продолжает работать."}}
async function logout(){try{await sb.auth.signOut()}finally{state.session=null;state.profile=null;state.myAds=[];state.favorites=new Set();renderHome();toast("Вы вышли из аккаунта")}}
function toggleLang(){let m=document.getElementById("langmenu");m.style.display=m.style.display==="block"?"none":"block"}function setLang(l,f){state.lang=l;localStorage.setItem("adamarket_lang",l);document.getElementById("flag").textContent=f;document.getElementById("langmenu").style.display="none";applyLanguage();renderHome();toast(l==="ru"?"Русский":l==="uz"?"O‘zbek":"English")}
(async()=>{document.getElementById("flag").textContent=state.lang==="uz"?"🇺🇿":state.lang==="en"?"🇬🇧":"🇷🇺";applyLanguage();document.documentElement.lang=state.lang;let {data}=await sb.auth.getSession();if(data.session){state.session=data.session;try{await bootstrap()}catch(e){console.warn("bootstrap failed",e)};await loadPlaces()}else await loadPlaces();renderHome();sb.auth.onAuthStateChange((_event,next)=>{state.session=next;})})();
</script><footer class="legalFooter"><a href="offer.html" target="_blank">Публичная оферта</a><a href="privacy.html" target="_blank">Политика конфиденциальности</a><span>© ADAMARKET</span></footer></body></html>
