function showContact(id,kind){if(!state.session){needAuth();toast("Войдите, чтобы увидеть контакт владельца");return}toast("Контакт владельца будет доступен после отправки заявки. Используйте кнопку «Оставить заявку»");return;/* protected contact API */} function legacyShowContact(id,kind){jsonFetch("/api/places/"+id+"/contact").then(d=>{if(!d.ok)throw Error(d.error);let c=esc(d.contact||"Контакт не указан"), link=d.contact&&/^\+?[0-9 ()-]{7,}$/.test(d.contact)?`<a class="primary" style="display:block;text-align:center;margin-top:12px" href="tel:${encodeURIComponent(d.contact)}">Позвонить владельцу</a>`:`<div class="note" style="margin-top:12px">${c}</div>`;if(kind==="telegram"&&d.contact?.includes("@"))link+=`<a class="ghost" style="display:block;text-align:center;margin-top:8px" href="https://t.me/${encodeURIComponent(d.contact.replace(/^@/,""))}" target="_blank">Открыть Telegram</a>`;openModal(`<h2>Контакт владельца</h2><p class="note">Контакт показан по вашему запросу. Для безопасного общения рекомендуем сначала отправить заявку.</p><b>${esc(d.owner_name||"Владелец")}</b>${link}`)}).catch(e=>toast(e.message||"Контакт пока недоступен"))}

function adCard(p){let isNew=p.created_at&&((Date.now()-new Date(p.created_at).getTime())<14*86400000),cover=p.cover_image||"assets/tashkent-hero.jpg";return `<article class="ad" onclick="openPlace(${p.id})"><img src="${esc(cover)}" onerror="this.src='assets/tashkent-hero.jpg'"><button class="heart" aria-label="Добавить в избранное" onclick="event.stopPropagation();toggleFav(${p.id})">${state.favorites.has(p.id)?"♥":"♡"}</button><div class="adbody"><div class="badges"><span class="badge">${esc(p.type)}</span><span class="trust">✓ Проверено</span>${p.has_contact?`<span class="trust">Контакт указан</span>`:""}${isNew?`<span class="trust new">Новое</span>`:""}</div><h3>${esc(p.title)}</h3><div class="meta">⌖ Ташкент, ${esc(p.district)}</div><div class="price">от ${money(p.price)}</div><div class="contactBtns"><button class="primary requestBtn" onclick="event.stopPropagation();requestOwner(${p.id})">Оставить заявку</button><button class="ghost miniBtn" onclick="event.stopPropagation();showContact(${p.id},'phone')">Позвонить</button><button class="ghost miniBtn" onclick="event.stopPropagation();showContact(${p.id},'telegram')">Telegram</button></div></div></article>`}

function renderSearch(){let a=state.places.length?state.places:state.demo;document.getElementById("content").innerHTML=`<div class="page"><div class="head"><h1 class="pageTitle">${t("searchTitle")}</h1><button class="ghost" onclick="goHome()">${t("home")}</button></div><div class="panel"><input id="searchQ" class="field" placeholder="${t("searchPlaceholder")}" oninput="filterSearch()"><div class="matchGrid" style="margin-top:10px"><select id="filterType" class="field" onchange="filterSearch()"><option value="">Все форматы</option><option>Баннер</option><option>Билборд</option><option>LED-экран</option><option>Вывеска</option><option>Световой короб</option></select><input id="filterDistrict" class="field" placeholder="Район" oninput="filterSearch()"><input id="filterMax" class="field" type="number" placeholder="До суммы" oninput="filterSearch()"><select id="filterSort" class="field" onchange="filterSearch()"><option value="new">Сначала новые</option><option value="price">Сначала дешевле</option><option value="price_desc">Сначала дороже</option></select></div></div><div id="results" class="list">${a.map(adCard).join("")}</div></div>`}
function filterSearch(){let q=(document.getElementById("searchQ")?.value||"").toLowerCase(),type=(document.getElementById("filterType")?.value||"").toLowerCase(),district=(document.getElementById("filterDistrict")?.value||"").toLowerCase(),max=Number(document.getElementById("filterMax")?.value)||0,sort=document.getElementById("filterSort")?.value||"new";let a=(state.places.length?state.places:state.demo).filter(p=>(p.title+" "+p.type+" "+p.city+" "+p.district+" "+(p.address||"")).toLowerCase().includes(q)&&(!type||(p.type||"").toLowerCase().includes(type))&&(!district||((p.district||"")+" "+(p.address||"")).toLowerCase().includes(district))&&(!max||Number(p.price||0)<=max));a.sort((x,y)=>sort==="price"?Number(x.price||0)-Number(y.price||0):sort==="price_desc"?Number(y.price||0)-Number(x.price||0):new Date(y.created_at||0)-new Date(x.created_at||0));document.getElementById("results").innerHTML=a.length?a.map(adCard).join(""): '<div class="panel empty">'+t('nothing')+'</div>'}

async function renderMessages(){document.getElementById("content").innerHTML=`<div class="page"><div class="head"><h1 class="pageTitle">Входящие заявки</h1><button class="ghost" onclick="goHome()">Главная</button></div><div id="inbox" class="panel empty">Загружаем заявки…</div></div>`;if(!state.session){document.getElementById("inbox").innerHTML="Войдите в аккаунт, чтобы видеть заявки.";return}try{const {data:ads,error:adsError}=await sb.from("ad_places").select("id,title").eq("owner_id",state.session.user.id).limit(100);if(adsError)throw adsError;const ids=(ads||[]).map(x=>x.id);if(!ids.length){document.getElementById("inbox").innerHTML="У вас пока нет рекламных мест.";return}const {data,error}=await sb.from("requests").select("id,place_id,message,status,date,created_at,advertiser_id").in("place_id",ids).order("created_at",{ascending:false}).limit(100);if(error)throw error;const names=Object.fromEntries((ads||[]).map(x=>[x.id,x.title]));const box=document.getElementById("inbox");box.outerHTML=data?.length?`<div class="inboxList">${data.map(r=>requestItem({...r,title:names[r.place_id]||"Объявление"})).join("")}</div>`:'<div class="panel empty">Новых заявок пока нет.</div>'}catch(e){document.getElementById("inbox").innerHTML="Не удалось загрузить заявки: "+esc(e.message||"")}}

async function saveSettings(){try{const full_name=document.getElementById("setName").value.trim(),phone=document.getElementById("setPhone").value.trim(),inn=document.getElementById("setInn").value.replace(/\s/g,"");if(!full_name)throw Error("Укажите имя");if(inn&&!/^\d{9,14}$/.test(inn))throw Error("ИНН: 9–14 цифр");const {error}=await sb.from("profiles").update({full_name,phone,inn}).eq("id",state.session.user.id);if(error)throw error;state.profile={...(state.profile||{}),full_name,phone,inn};toast("Настройки сохранены");renderProfile()}catch(e){toast(e.message||"Не удалось сохранить настройки")}}

let pickMapObj=null,pickMarker=null;function pickMap(){document.getElementById("pick").classList.remove("hidden");setTimeout(()=>{if(!pickMapObj){pickMapObj=L.map("pickMap").setView([41.3111,69.2797],11);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(pickMapObj);pickMapObj.on("click",e=>{document.getElementById("fLat").value=e.latlng.lat.toFixed(6);document.getElementById("fLng").value=e.latlng.lng.toFixed(6);if(pickMarker)pickMarker.setLatLng(e.latlng);else pickMarker=L.marker(e.latlng).addTo(pickMapObj)})}pickMapObj.invalidateSize()},80)}
async function createPlace(){try{if(!document.getElementById("freeTerms")?.checked||!document.getElementById("freeHuman")?.checked||document.getElementById("freeTrap")?.value)throw Error("Подтвердите оферту и что вы не робот");let title=document.getElementById("fTitle").value.trim(),price=Number(document.getElementById("fPrice").value);if(!title)throw Error("Укажите название");if(!document.getElementById("fName").value.trim()||!document.getElementById("fContact").value.trim())throw Error("Укажите имя и контакт");if(!Number.isFinite(price)||price<0)throw Error("Укажите корректную цену");let place={title,type:document.getElementById("fType").value,price,unit:"month",city:document.getElementById("fCity").value.trim()||"Ташкент",district:document.getElementById("fDistrict").value.trim(),address:document.getElementById("fAddress").value.trim(),latitude:document.getElementById("fLat").value?Number(document.getElementById("fLat").value):null,longitude:document.getElementById("fLng").value?Number(document.getElementById("fLng").value):null,description:document.getElementById("fDesc").value.trim(),owner_name:document.getElementById("fName").value.trim(),owner_contact:document.getElementById("fContact").value.trim(),cover_image:"assets/tashkent-hero.jpg"};const {data:created,error}=await sb.from("ad_places").insert({owner_id:state.session.user.id,title:place.title,type:place.type,city:place.city,district:place.district||null,address:place.address||null,price:place.price,currency:"UZS",unit:place.unit,description:place.description||null,latitude:place.latitude,longitude:place.longitude,cover_image:null,images:[],status:"pending",is_active:false,promotion_type:"none"}).select().single();if(error)throw error;toast("Объявление отправлено на проверку");await bootstrap();renderMyAds()}catch(e){toast(e.message)}}
async function editPlace(id){let p=state.myAds.find(x=>x.id===id);if(!p)return;renderAdd();setTimeout(()=>{document.getElementById("fTitle").value=p.title||"";document.getElementById("fType").value=p.type||"Баннер";document.getElementById("fPrice").value=p.price||"";document.getElementById("fCity").value=p.city||"Ташкент";document.getElementById("fDistrict").value=p.district||"";document.getElementById("fAddress").value=p.address||"";document.getElementById("fLat").value=p.latitude??"";document.getElementById("fLng").value=p.longitude??"";document.getElementById("fDesc").value=p.description||"";const button=document.querySelector('#content button[onclick="createPlace()"]');if(button){button.textContent="Сохранить изменения";button.onclick=()=>updatePlace(id)}},0)}
async function updatePlace(id){try{const p=state.myAds.find(x=>x.id===id);if(!p)throw Error("Объявление не найдено");const title=document.getElementById("fTitle").value.trim(),price=Number(document.getElementById("fPrice").value);if(!title)throw Error("Укажите название");if(!document.getElementById("fName").value.trim()||!document.getElementById("fContact").value.trim())throw Error("Укажите имя и контакт");if(!Number.isFinite(price)||price<0)throw Error("Укажите корректную цену");const place={title,type:document.getElementById("fType").value,price,unit:p.unit||"month",city:document.getElementById("fCity").value.trim(),district:document.getElementById("fDistrict").value.trim(),address:document.getElementById("fAddress").value.trim(),latitude:document.getElementById("fLat").value?Number(document.getElementById("fLat").value):null,longitude:document.getElementById("fLng").value?Number(document.getElementById("fLng").value):null,description:document.getElementById("fDesc").value.trim()};const {error}=await sb.from("ad_places").update({...place,status:"pending",is_active:false,updated_at:new Date().toISOString()}).eq("id",id).eq("owner_id",state.session.user.id);if(error)throw error;toast("Изменения отправлены на повторную проверку");await bootstrap();renderMyAds()}catch(e){toast(e.message||"Не удалось сохранить изменения")}}
function requestOwner(id){if(!state.session){needAuth();toast("Войдите, чтобы отправить заявку");return}let p=[...state.places,...state.demo].find(x=>x.id===id);if(!p)return;openModal(`<h2>Заявка: ${esc(p.title)}</h2><p class="note">Владелец получит ваш запрос. Ваше имя и телефон будут взяты из профиля. ADAMARKET не берёт оплату за отправку заявки.</p><label class="label">Ваш запрос *</label><textarea id="rqMessage" class="field" rows="4" placeholder="Нужна реклама на месяц в районе..."></textarea><button class="primary" style="width:100%;margin-top:14px" onclick="sendRequest(${id})">Отправить заявку бесплатно</button>`)}
async function sendRequest(id){try{if(!state.session)throw Error("Сначала войдите в аккаунт");const message=document.getElementById("rqMessage").value.trim();if(!message)throw Error("Опишите задачу");const {error}=await sb.from("requests").insert({advertiser_id:state.session.user.id,place_id:id,date:new Date().toISOString().slice(0,10),message,status:"Новая"});if(error)throw error;closeModal();toast("Заявка отправлена владельцу бесплатно")}catch(e){toast(e.message||"Не удалось отправить заявку")}}
async function toggleFav(id){state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);localStorage.setItem("adamarket_favorites",JSON.stringify([...state.favorites]));toast(state.favorites.has(id)?"Добавлено в избранное":"Удалено из избранного");renderSearch()}
async function bootstrap(){let {data:s}=await sb.auth.getSession();state.session=s.session;if(!state.session){state.profile=null;state.myAds=[];return}let d=await api("bootstrap");state.profile=d.profile;state.myAds=d.ads||[];state.favorites=new Set(d.favorites||[])}
async function loadPlaces(){let local=JSON.parse(localStorage.getItem(LOCAL_KEY)||"[]");try{let r=await fetch(API+"?action=places",{headers:{Accept:"application/json",apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}}),d=await r.json();state.places=Array.isArray(d.places)?d.places:local;}catch(e){state.places=local}state.favorites=new Set(JSON.parse(localStorage.getItem("adamarket_favorites")||"[]"));return state.places}
async function askAI(){let q=document.getElementById("aiQuestion")?.value.trim(),box=document.getElementById("aiAnswer");if(!q)return toast("Опишите задачу");box.classList.remove("hidden");box.textContent="Проверяем варианты в каталоге…";try{let r=await fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:q})}),d=await r.json();if(!r.ok)throw Error(d.error||"Помощник временно недоступен");box.textContent=d.answer||"Подходящих вариантов пока нет."}catch(e){box.textContent="Помощник временно недоступен. Откройте каталог — он продолжает работать."}}
let placesRealtimeChannel=null;
function setupPlacesRealtime(){
  if(placesRealtimeChannel)return;
  placesRealtimeChannel=sb.channel("adamarket-ad-places-live")
    .on("postgres_changes",{event:"*",schema:"public",table:"ad_places"},async(payload)=>{
      try{
        await loadPlaces();
        if(typeof renderHome==="function")renderHome();
      }catch(e){console.warn("ADAMARKET realtime sync:",e)}
    })
    .subscribe((status,err)=>{
      if(status==="CHANNEL_ERROR"||status==="TIMED_OUT")console.warn("ADAMARKET realtime:",status,err);
    });
}
async function logout(){try{await sb.auth.signOut()}finally{state.session=null;state.profile=null;state.myAds=[];state.favorites=new Set();renderHome();toast("Вы вышли из аккаунта")}}
function toggleLang(){let m=document.getElementById("langmenu");m.style.display=m.style.display==="block"?"none":"block"}function setLang(l,f){state.lang=l;localStorage.setItem("adamarket_lang",l);document.getElementById("flag").textContent=f;document.getElementById("langmenu").style.display="none";applyLanguage();renderHome();toast(l==="ru"?"Русский":l==="uz"?"O‘zbek":"English")}
