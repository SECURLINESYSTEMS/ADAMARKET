name: ADAMARKET Android Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Make Gradle executable
        run: chmod +x android-demo/gradlew
      - name: Build debug APK
        working-directory: android-demo
        run: ./gradlew --no-daemon clean assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ADAMARKET-debug-${{ github.sha }}
          path: android-demo/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
