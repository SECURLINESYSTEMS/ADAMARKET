name: CRM SaaS database tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - crm-saas-local-foundation
      - docs/crm-saas-audit-and-roadmap
      - main
  push:
    branches:
      - crm-saas-local-foundation

permissions:
  contents: read

jobs:
  supabase-local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check browser client JavaScript syntax
        run: node --check crm-saas-local/app/app.mjs

      - name: Check browser-to-schema contract
        run: node --test crm-saas-local/tests/client-contract.test.mjs

      - name: Install Supabase CLI
        id: setup_cli
        uses: supabase/setup-cli@v1
        with:
          version: 2.79.0

      - name: Start isolated local Supabase stack
        working-directory: crm-saas-local
        run: supabase start --exclude studio,edge-runtime,logflare,vector,imgproxy

      - name: Reset the disposable local database and apply all migrations
        working-directory: crm-saas-local
        run: supabase db reset

      - name: Run pgTAP security tests
        working-directory: crm-saas-local
        run: supabase test db

      - name: Stop local Supabase stack
        if: always() && steps.setup_cli.outcome == 'success'
        working-directory: crm-saas-local
        run: supabase stop
