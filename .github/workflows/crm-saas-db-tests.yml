name: CRM SaaS database tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - crm-saas-local-foundation
      - docs/crm-saas-audit-and-roadmap
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: crm-saas-local-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  supabase-local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check browser client JavaScript syntax
        run: node --check crm-saas-local/app/app.mjs

      - name: Check browser-to-schema contract
        run: node --test crm-saas-local/tests/client-contract.test.mjs

      - name: Install Supabase CLI
        id: setup_cli
        uses: supabase/setup-cli@v1
        with:
          version: 2.79.0

      - name: Start isolated local Supabase stack
        working-directory: crm-saas-local
        run: supabase start --exclude studio,edge-runtime,logflare,vector,imgproxy

      - name: Reset the disposable local database and apply all migrations
        working-directory: crm-saas-local
        run: supabase db reset

      - name: Run pgTAP security tests
        working-directory: crm-saas-local
        run: supabase test db

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Configure browser client for local Supabase
        working-directory: crm-saas-local
        shell: bash
        run: |
          STATUS="$(supabase status -o env)"
          API_URL="$(printf '%s\n' "$STATUS" | sed -n 's/^API_URL=//p' | tr -d '"')"
          ANON_KEY="$(printf '%s\n' "$STATUS" | sed -n 's/^ANON_KEY=//p' | tr -d '"')"
          test -n "$API_URL"
          test -n "$ANON_KEY"
          printf 'window.CRM_CONFIG = { supabaseUrl: "%s", publishableKey: "%s" };\n' "$API_URL" "$ANON_KEY" > app/config.js

      - name: Start static browser app
        run: |
          python3 -m http.server 3000 --directory crm-saas-local/app > /tmp/crm-saas-http.log 2>&1 &
          echo $! > /tmp/crm-saas-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/crm-saas-http.log
          exit 1

      - name: Run authenticated browser end-to-end tests
        run: node crm-saas-local/tests/browser-e2e.test.mjs

      - name: Stop static browser app
        if: always()
        run: |
          if [ -f /tmp/crm-saas-http.pid ]; then kill "$(cat /tmp/crm-saas-http.pid)" || true; fi

      - name: Stop local Supabase stack
        if: always() && steps.setup_cli.outcome == 'success'
        working-directory: crm-saas-local
        run: supabase stop
