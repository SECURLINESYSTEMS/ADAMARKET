name: CRM SaaS database tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - crm-saas-local-foundation
      - docs/crm-saas-audit-and-roadmap
  push:
    branches:
      - crm-saas-local-foundation

permissions:
  contents: read

jobs:
  supabase-local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start isolated local Supabase stack
        working-directory: crm-saas-local
        run: supabase start --exclude studio,edge-runtime,logflare,vector,imgproxy

      - name: Reset the disposable local database and apply all migrations
        working-directory: crm-saas-local
        run: supabase db reset

      - name: Run pgTAP security tests
        working-directory: crm-saas-local
        run: supabase test db

      - name: Stop local Supabase stack
        if: always()
        working-directory: crm-saas-local
        run: supabase stop
