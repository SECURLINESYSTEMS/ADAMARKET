name: ADAMARKET source refactor
on:
  push:
    branches: [manus/prod-hardening]
    paths: ['scripts/refactor_frontend_state.py', '.github/workflows/source-refactor-clean.yml']
  pull_request:
    branches: [main]
    paths: ['index.html', 'scripts/refactor_frontend_state.py', '.github/workflows/source-refactor-clean.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refactor:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: manus/prod-hardening, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Refactor frontend source
        run: python scripts/refactor_frontend_state.py
      - name: Enforce canonical boot boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          a=s.index('<script>')+len('<script>')
          b=s.index('</script>',a)
          js=s[a:b]
          marker='(async()=>{const {data}=await sb.auth.getSession();'
          i=js.find(marker)
          if i < 0:
              raise SystemExit('canonical boot marker missing')
          j=js.find('renderHome()})();',i)
          if j < 0:
              raise SystemExit('canonical boot terminator missing')
          js=js[:j+len('renderHome()})();')]+'\n'
          if js.count('(async()=>{const {data}=await sb.auth.getSession();') != 1:
              raise SystemExit('duplicate canonical boot')
          s=s[:a]+js+s[b:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate generated source
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'window.AdamarketState' in s
          assert '()}renderHome()})();' not in s
          assert s.count('(async()=>{const {data}=await sb.auth.getSession();') == 1
          PY
      - name: Commit generated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git diff --cached --quiet || (git commit -m 'refactor: centralize frontend state' && git push origin HEAD:manus/prod-hardening)
