name: ADAMARKET source refactor
on:
  push:
    branches: [manus/prod-hardening]
    paths: ['scripts/refactor_frontend_state.py', '.github/workflows/source-refactor-clean.yml']
  pull_request:
    branches: [main]
    paths: ['index.html', 'scripts/refactor_frontend_state.py', '.github/workflows/source-refactor-clean.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refactor:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: manus/prod-hardening, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/refactor_frontend_state.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git diff --cached --quiet || (git commit -m 'refactor: centralize frontend state' && git push origin HEAD:manus/prod-hardening)
