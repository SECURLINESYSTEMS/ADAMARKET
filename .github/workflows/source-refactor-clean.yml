name: ADAMARKET source refactor
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run idempotent source checks
        run: |
          python scripts/refactor_frontend_state.py
          python scripts/ensure_role_flows.py
      - name: Validate generated source
        run: |
          python - <<'PY2' > /tmp/adamarket.js
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('<script>')+8; b=s.index('</script>',a)
          print(s[a:b])
          PY2
          node --check /tmp/adamarket.js
          grep -q 'function renderProducer()' index.html
          grep -q 'function createProducer()' index.html
          grep -q 'window.AdamarketState' index.html
          git diff --check
      - name: Commit source changes when needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then git commit -m 'chore: normalize frontend source'; git push; fi
