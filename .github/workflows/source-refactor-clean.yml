name: ADAMARKET source refactor
on:
  push:
    branches: [manus/prod-hardening]
    paths: ['scripts/refactor_frontend_state.py', '.github/workflows/source-refactor-clean.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: manus/prod-hardening}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/refactor_frontend_state.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git diff --cached --quiet || (git commit -m 'refactor: centralize frontend state' && git push origin HEAD:manus/prod-hardening)
