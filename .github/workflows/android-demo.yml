name: Build ADAMARKET Android Demo
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-demo/**'
      - '.github/workflows/android-demo.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK
        run: cp android-demo/app/build/outputs/apk/debug/app-debug.apk ADAMARKET-DEMO.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ADAMARKET-Android-Demo
          path: ADAMARKET-DEMO.apk
          retention-days: 30
