name: Build ADAMARKET Android Demo

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-demo/**'
      - '.github/workflows/android-demo.yml'
      - '.github/workflows/validate.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate Android sources
        run: |
          test -f android-demo/settings.gradle
          test -f android-demo/app/src/main/AndroidManifest.xml
          test -f android-demo/app/src/main/assets/prod_hardening.js
          node --check android-demo/app/src/main/assets/prod_hardening.js
      - name: Build debug APK
        working-directory: android-demo
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Build unsigned release APK
        working-directory: android-demo
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp android-demo/app/build/outputs/apk/debug/app-debug.apk dist/ADAMARKET-DEMO-debug.apk
          cp android-demo/app/build/outputs/apk/release/app-release-unsigned.apk dist/ADAMARKET-DEMO-release-unsigned.apk
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ADAMARKET-Android-Demo-1.1.1
          path: dist/*.apk
          retention-days: 30
