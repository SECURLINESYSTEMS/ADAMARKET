name: Build ADAMARKET Android Release
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/google-play
    paths:
      - 'android-demo/**'
      - 'index.html'
      - '.github/workflows/android-demo.yml'
      - '.github/workflows/validate.yml'
permissions:
  contents: write
env:
  HAS_RELEASE_SIGNING: ${{ secrets.ADAMARKET_KEYSTORE_BASE64 != '' && secrets.ADAMARKET_KEYSTORE_PASSWORD != '' && secrets.ADAMARKET_KEY_ALIAS != '' && secrets.ADAMARKET_KEY_PASSWORD != '' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate Android sources
        run: |
          test -f android-demo/settings.gradle
          test -f android-demo/app/src/main/AndroidManifest.xml
          test -f android-demo/app/src/main/java/uz/adamarket/app/MainActivity.java
      - name: Build debug APK
        working-directory: android-demo
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Configure release signing
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          ADAMARKET_KEYSTORE_BASE64: ${{ secrets.ADAMARKET_KEYSTORE_BASE64 }}
          ADAMARKET_KEYSTORE_PASSWORD: ${{ secrets.ADAMARKET_KEYSTORE_PASSWORD }}
          ADAMARKET_KEY_ALIAS: ${{ secrets.ADAMARKET_KEY_ALIAS }}
          ADAMARKET_KEY_PASSWORD: ${{ secrets.ADAMARKET_KEY_PASSWORD }}
        run: |
          echo "$ADAMARKET_KEYSTORE_BASE64" | base64 --decode > android-demo/adamarket-release.jks
          cat > android-demo/signing.properties <<EOF
          storeFile=adamarket-release.jks
          storePassword=$ADAMARKET_KEYSTORE_PASSWORD
          keyAlias=$ADAMARKET_KEY_ALIAS
          keyPassword=$ADAMARKET_KEY_PASSWORD
          EOF
      - name: Build signed release APK and Play bundle
        if: env.HAS_RELEASE_SIGNING == 'true'
        working-directory: android-demo
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
      - name: Build unsigned release for diagnosis
        if: env.HAS_RELEASE_SIGNING != 'true'
        working-directory: android-demo
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp android-demo/app/build/outputs/apk/debug/app-debug.apk dist/ADAMARKET-debug.apk
          if [ -f android-demo/app/build/outputs/apk/release/app-release.apk ]; then cp android-demo/app/build/outputs/apk/release/app-release.apk dist/ADAMARKET-release.apk; fi
          if [ -f android-demo/app/build/outputs/apk/release/app-release-unsigned.apk ]; then cp android-demo/app/build/outputs/apk/release/app-release-unsigned.apk dist/ADAMARKET-release-unsigned.apk; fi
          if [ -f android-demo/app/build/outputs/bundle/release/app-release.aab ]; then
            if [ "$HAS_RELEASE_SIGNING" = "true" ]; then
              cp android-demo/app/build/outputs/bundle/release/app-release.aab dist/ADAMARKET-release.aab
            else
              cp android-demo/app/build/outputs/bundle/release/app-release.aab dist/ADAMARKET-release-unsigned.aab
            fi
          fi
          printf 'Signing configured: %s\n' "$HAS_RELEASE_SIGNING" > dist/RELEASE-STATUS.txt
      - name: Publish public Android APK download
        if: env.HAS_RELEASE_SIGNING == 'true' && github.ref == 'refs/heads/release/google-play'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.3.0
          name: ADAMARKET Android 1.3.0
          target_commitish: ${{ github.sha }}
          body: |
            Официальная Android-версия ADAMARKET 1.3.0.

            Установочный APK предназначен для устройств Android. Скачивайте приложение только с официального сайта adamarket.uz.
          files: dist/ADAMARKET-release.apk
          fail_on_unmatched_files: true
          make_latest: false
      - uses: actions/upload-artifact@v4
        with:
          name: ADAMARKET-Android-Release-1.3.0
          path: dist/*
          retention-days: 30
