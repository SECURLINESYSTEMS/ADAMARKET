name: Build ADAMARKET Android Demo

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-demo/**'
      - 'index.html'
      - '.github/workflows/android-demo.yml'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate Android sources
        run: |
          test -f android-demo/settings.gradle
          test -f android-demo/app/src/main/AndroidManifest.xml
          test -f android-demo/app/src/main/assets/prod_hardening.js
          node --check android-demo/app/src/main/assets/prod_hardening.js
      - name: Build debug APK
        working-directory: android-demo
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Build unsigned release APK
        working-directory: android-demo
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Configure release signing when secrets are available
        if: ${{ secrets.ADAMARKET_KEYSTORE_BASE64 != '' && secrets.ADAMARKET_KEYSTORE_PASSWORD != '' && secrets.ADAMARKET_KEY_ALIAS != '' && secrets.ADAMARKET_KEY_PASSWORD != '' }}
        env:
          ADAMARKET_KEYSTORE_BASE64: ${{ secrets.ADAMARKET_KEYSTORE_BASE64 }}
        run: |
          echo "$ADAMARKET_KEYSTORE_BASE64" | base64 --decode > android-demo/adamarket-release.jks
          cat > android-demo/signing.properties <<'EOF'
          storeFile=adamarket-release.jks
          storePassword=${{ secrets.ADAMARKET_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ADAMARKET_KEY_ALIAS }}
          keyPassword=${{ secrets.ADAMARKET_KEY_PASSWORD }}
          EOF
      - name: Build signed release APK/AAB when keystore is available
        if: ${{ secrets.ADAMARKET_KEYSTORE_BASE64 != '' && secrets.ADAMARKET_KEYSTORE_PASSWORD != '' && secrets.ADAMARKET_KEY_ALIAS != '' && secrets.ADAMARKET_KEY_PASSWORD != '' }}
        working-directory: android-demo
        run: |
          gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp android-demo/app/build/outputs/apk/debug/app-debug.apk dist/ADAMARKET-DEMO-debug.apk
          cp android-demo/app/build/outputs/apk/release/app-release-unsigned.apk dist/ADAMARKET-DEMO-release-unsigned.apk
          if [ -f android-demo/app/build/outputs/apk/release/app-release.apk ]; then cp android-demo/app/build/outputs/apk/release/app-release.apk dist/ADAMARKET-DEMO-release.apk; fi
          if [ -f android-demo/app/build/outputs/bundle/release/app-release.aab ]; then cp android-demo/app/build/outputs/bundle/release/app-release.aab dist/ADAMARKET-DEMO-release.aab; fi
      - name: Upload APKs/AAB
        uses: actions/upload-artifact@v4
        with:
          name: ADAMARKET-Android-Demo-1.1.2
          path: dist/*
          retention-days: 30
