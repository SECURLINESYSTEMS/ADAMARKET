name: Apply source refactor

on:
  push:
    branches: [manus/prod-hardening]
    paths:
      - 'scripts/refactor_frontend_state.py'
      - '.github/workflows/refactor-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manus/prod-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refactor frontend state
        run: python scripts/refactor_frontend_state.py
      - name: Commit generated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor: use AdamarketState as frontend source of truth'
          git push origin HEAD:manus/prod-hardening
