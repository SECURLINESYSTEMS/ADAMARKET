name: ADAMARKET SEO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply SEO metadata
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "<title>ADAMARKET — Ташкентская площадка для рекламы</title>",
              "<title>ADAMARKET — объявления в Узбекистане | Купить и продать</title>",
              1
          )
          marker = "<!-- ADAMARKET SEO HEAD -->"
          block = '''<!-- ADAMARKET SEO HEAD -->
<meta name="description" content="ADAMARKET — бесплатная площадка объявлений в Узбекистане. Покупайте и продавайте товары, услуги, рекламные места, баннеры, вывески, LED-экраны и билборды.">
<meta name="robots" content="index,follow,max-image-preview:large">
<link rel="canonical" href="https://adamarket.uz/">
<meta property="og:title" content="ADAMARKET — объявления в Узбекистане">
<meta property="og:description" content="Покупайте и продавайте на ADAMARKET. Бесплатное размещение объявлений.">
<meta property="og:url" content="https://adamarket.uz/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ADAMARKET">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="ADAMARKET — объявления в Узбекистане">
<meta name="twitter:description" content="Бесплатная площадка объявлений в Узбекистане.">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebSite","name":"ADAMARKET","url":"https://adamarket.uz/","inLanguage":["ru","uz","en"],"potentialAction":{"@type":"SearchAction","target":"https://adamarket.uz/?q={search_term_string}","query-input":"required name=search_term_string"}}
</script>
'''
          if marker not in s:
              s = s.replace("</title>", "</title>\n" + block, 1)
          p.write_text(s, encoding="utf-8")
      - name: Commit SEO changes
        run: |
          git config user.name "ADAMARKET SEO"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "SEO: optimize index metadata"
          git push
