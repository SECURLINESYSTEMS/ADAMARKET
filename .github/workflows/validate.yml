name: Validate ADAMARKET
on:
  push:
    branches: [main, manus/prod-hardening]
    paths:
      - 'index.html'
      - 'download.html'
      - 'sitemap.xml'
      - '404.html'
      - 'partners/**'
      - 'supabase/migrations/**'
      - 'tests/**'
      - 'android-demo/**'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend smoke tests
        run: node tests/frontend_smoke.js
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script([^>]*)>([\s\S]*?)</script>', html, re.I)
          inline=[body for attrs,body in scripts if 'application/ld+json' not in attrs.lower() and body.strip()]
          Path('/tmp/adamarket-inline.js').write_text('\n'.join(inline),encoding='utf-8')
          print('Inline script blocks:',len(inline))
          PY
          node --check /tmp/adamarket-inline.js
      - name: Verify Android release version consistency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path('android-demo/app/build.gradle').read_text(encoding='utf-8')
          page = Path('download.html').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/android-demo.yml').read_text(encoding='utf-8')
          version = re.search(r"versionName\s+'([^']+)'", gradle)
          code = re.search(r'versionCode\s+(\d+)', gradle)
          assert version and code, 'Android versionName/versionCode not found'
          v = version.group(1)
          assert f'android-v{v}' in page, f'download.html release link must target android-v{v}'
          assert f'Версия {v}' in page, f'download.html label must show {v}'
          assert f'tag_name: android-v{v}' in workflow, f'release tag must match {v}'
          assert f'ADAMARKET Android {v}' in workflow, f'release title must match {v}'
          assert f'ADAMARKET-Android-Release-{v}' in workflow, f'artifact name must match {v}'
          print(f'Android release version is consistent: {v} (versionCode {code.group(1)})')
          PY
      - name: Validate Android Java sources
        run: test -f android-demo/app/src/main/java/uz/adamarket/app/MainActivity.java
      - name: Check repository whitespace
        run: git diff --check
      - name: Check public API
        run: |
          curl -fsS "https://nmskpqugwiwdcukqckcy.supabase.co/functions/v1/adamarket-web-api?action=plans" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x.ok)process.exit(1);console.log("plans:",(x.plans||[]).length)})'
          curl -fsS "https://nmskpqugwiwdcukqckcy.supabase.co/functions/v1/adamarket-web-api?action=places" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x.ok)process.exit(1);console.log("places:",(x.places||[]).length)})'
