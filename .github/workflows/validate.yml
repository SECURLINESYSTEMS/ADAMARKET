name: Validate ADAMARKET
on:
  push:
    branches: [main, manus/prod-hardening]
    paths:
      - 'index.html'
      - 'tests/**'
      - 'android-demo/**'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend smoke tests
        run: node tests/frontend_smoke.js
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, re.I)
          inline=[s for s in scripts if s.strip()]
          Path('/tmp/adamarket-inline.js').write_text('\n'.join(inline),encoding='utf-8')
          print('Inline script blocks:',len(inline))
          PY
          node --check /tmp/adamarket-inline.js
      - name: Validate Android Java sources
        run: test -f android-demo/app/src/main/java/uz/adamarket/app/MainActivity.java
      - name: Check repository whitespace
        run: git diff --check
      - name: Check public API
        run: |
          curl -fsS "https://nmskpqugwiwdcukqckcy.supabase.co/functions/v1/adamarket-web-api?action=plans" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x.ok)process.exit(1);console.log("plans:",(x.plans||[]).length)})'
          curl -fsS "https://nmskpqugwiwdcukqckcy.supabase.co/functions/v1/adamarket-web-api?action=places" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x.ok)process.exit(1);console.log("places:",(x.places||[]).length)})'
