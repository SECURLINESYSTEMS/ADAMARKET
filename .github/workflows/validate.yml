name: Validate ADAMARKET
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/validate.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node - <<'NODE'
          const fs=require('fs'), re=/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi, s=fs.readFileSync('index.html','utf8'); let m,j=''; while((m=re.exec(s))) j+=m[1]+'\n'; fs.writeFileSync('/tmp/adamarket-inline.js',j);
          NODE
          node --check /tmp/adamarket-inline.js
      - name: Frontend smoke tests
        run: node tests/frontend_smoke.js
