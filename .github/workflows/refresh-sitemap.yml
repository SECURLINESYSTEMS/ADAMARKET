name: Refresh sitemap from approved listings

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-sitemap
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Add active public listings to sitemap
        run: node scripts/generate_sitemap.mjs
      - name: Commit sitemap only when changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Refresh sitemap with approved listings"
          git push origin main
